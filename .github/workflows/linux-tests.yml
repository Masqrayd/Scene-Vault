name: Scene Controller behavior tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev libobs-dev xvfb
      - run: cmake -S . -B build -G Ninja -DSCENE_VAULT_SYSTEM_BUILD=ON -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: xvfb-run -a ctest --test-dir build --output-on-failure
